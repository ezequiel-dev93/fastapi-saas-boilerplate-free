<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{% block title %}{{ project_name }}{% endblock %}</title>
  <style>
    /* Reset básico para clientes de correo */
    body {
      margin: 0;
      padding: 0;
      background-color: #F4F6EC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #171A16;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.6;
    }

    table {
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }

    td {
      padding: 0;
    }

    img {
      border: 0;
      line-height: 100%;
      outline: none;
      text-decoration: none;
    }

    .wrapper {
      width: 100%;
      background-color: #F4F6EC;
      padding: 48px 16px;
    }

    .card {
      max-width: 560px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      border: 1px solid #D4DAC0;
      box-shadow: 0 10px 25px -5px rgba(23, 26, 22, 0.06);
      overflow: hidden;
    }

    .header-bar {
      height: 6px;
      background: linear-gradient(90deg, #D7FF00 0%, #FF6A00 100%);
    }

    .brand-section {
      padding: 32px 36px 16px 36px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      display: inline-block;
      width: 36px;
      height: 36px;
      background: #111111;
      border-radius: 10px;
      text-align: center;
      line-height: 36px;
      color: #D7FF00;
      font-weight: 800;
      font-size: 18px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      color: #171A16;
      letter-spacing: -0.02em;
    }

    .content-section {
      padding: 16px 36px 36px 36px;
    }

    h1, h2 {
      margin-top: 0;
      color: #171A16;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    p {
      margin: 0 0 16px 0;
      color: #333932;
      font-size: 15px;
      line-height: 1.6;
    }

    .info-card {
      background-color: #F8F9F3;
      border: 1px solid #E0E5D2;
      border-radius: 12px;
      padding: 20px;
      margin: 24px 0;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #EBEFE0;
      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .info-label {
      color: #5A5A5A;
      font-weight: 500;
    }

    .info-value {
      color: #171A16;
      font-weight: 700;
      text-align: right;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-indigo {
      background-color: #F0FED0;
      color: #171A16;
      border: 1px solid #D7FF00;
    }

    .badge-emerald {
      background-color: #E8FCCC;
      color: #171A16;
      border: 1px solid #9EFF00;
    }

    .badge-amber {
      background-color: #FFF2E5;
      color: #FF6A00;
      border: 1px solid #FF6A00;
    }

    .button-container {
      margin: 32px 0 24px 0;
      text-align: center;
    }

    .email-button {
      display: inline-block;
      background: #111111;
      color: #D7FF00 !important;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
      box-shadow: 0 4px 14px rgba(17, 17, 17, 0.25);
      transition: background 0.2s;
    }

    .email-button:hover {
      background: #222222;
    }

    .footer-section {
      padding: 24px 36px 36px 36px;
      background-color: #F8F9F3;
      border-top: 1px solid #E0E5D2;
      text-align: center;
      font-size: 13px;
      color: #5A5A5A;
    }

    .footer-section p {
      margin: 0 0 6px 0;
      font-size: 13px;
      color: #5A5A5A;
    }

    .footer-links {
      margin-top: 12px;
    }

    .footer-links a {
      color: #171A16;
      text-decoration: underline;
      margin: 0 8px;
    }

    @media (max-width: 600px) {
      .card {
        border-radius: 12px;
      }
      .brand-section, .content-section, .footer-section {
        padding-left: 24px !important;
        padding-right: 24px !important;
      }
      .email-button {
        display: block;
        padding: 14px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="card">
      <div class="header-bar"></div>
      
      <div class="brand-section">
        <div class="brand-logo">⚡</div>
        <div class="brand-name">{{ project_name }}</div>
      </div>

      <div class="content-section">
        {% block content %}{% endblock %}
      </div>

      <div class="footer-section">
        <p>Has recibido este correo electrónico transaccional de <strong>{{ project_name }}</strong>.</p>
        <p>© 2026 {{ project_name }}. Todos los derechos reservados.</p>
        <div class="footer-links">
          <a href="#">Centro de Ayuda</a> •
          <a href="#">Términos del Servicio</a> •
          <a href="#">Privacidad</a>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
